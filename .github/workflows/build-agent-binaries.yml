name: build-agent-binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de release cible (ex: v0.2.16). Laisser vide pour build-only."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows binary
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[full]" pyinstaller

      - name: Build executable with PyInstaller
        run: pyinstaller raguia_agent.spec --noconfirm

      - name: Package Windows artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          src = Path("dist/raguia-agent.exe")
          if not src.exists():
              raise SystemExit(f"Expected file not found: {src}")

          target = Path("raguia-agent-windows.exe")
          shutil.copy2(src, target)

          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          Path("raguia-agent-windows.exe.sha256").write_text(
              f"{digest}  {target.name}\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            raguia-agent-windows.exe
            raguia-agent-windows.exe.sha256
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS arm64 binary
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[full]" pyinstaller

      - name: Build app bundle with PyInstaller
        run: pyinstaller raguia_agent.spec --noconfirm

      - name: Package macOS artifacts
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/raguia-agent.app" "raguia-agent-macos-arm64.zip"
          python - <<'PY'
          from pathlib import Path
          import hashlib

          target = Path("raguia-agent-macos-arm64.zip")
          if not target.exists():
              raise SystemExit(f"Expected file not found: {target}")

          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          Path("raguia-agent-macos-arm64.zip.sha256").write_text(
              f"{digest}  {target.name}\n",
              encoding="utf-8",
          )
          PY

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: |
            raguia-agent-macos-arm64.zip
            raguia-agent-macos-arm64.zip.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release assets
    if: ${{ github.event_name == 'push' || github.event.inputs.release_tag != '' }}
    needs:
      - build-windows
      - build-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/raguia-agent-windows.exe
            release-assets/raguia-agent-windows.exe.sha256
            release-assets/raguia-agent-macos-arm64.zip
            release-assets/raguia-agent-macos-arm64.zip.sha256
