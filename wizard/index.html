<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configuration Raguia Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --error: #dc2626;
      --success: #16a34a;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .wizard {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
      width: 100%;
      max-width: 460px;
    }
    .wizard-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .wizard-header .logo {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .wizard-header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
    }
    .wizard-header p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 5px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.875rem;
      color: var(--text);
      background: var(--surface);
      transition: border-color .15s, box-shadow .15s;
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }
    .form-group input::placeholder { color: #94a3b8; }
    .input-with-button {
      display: flex;
      gap: 8px;
    }
    .input-with-button input { flex: 1; }
    .input-with-button button {
      white-space: nowrap;
      padding: 10px 14px;
      font-size: 0.8125rem;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .input-with-button button:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .btn-primary {
      width: 100%;
      padding: 12px;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      transition: background .15s, transform .1s, opacity .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:active { transform: scale(.98); }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; }
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .55s linear infinite;
    }
    .btn-primary.loading .spinner { display: inline-block; }
    .btn-primary.loading .btn-text { opacity: .75; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .message {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.8125rem;
      display: none;
    }
    .message.error { display: block; background: #fef2f2; color: var(--error); border: 1px solid #fecaca; }
    .message.success { display: block; background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="wizard">
    <div class="wizard-header">
      <div class="logo">⚡</div>
      <h1>Raguia Agent</h1>
      <p>Configuration de votre agent de synchronisation</p>
    </div>

    <form id="wizardForm">
      <div class="form-group">
        <label for="apiUrl">URL du portail</label>
        <input type="url" id="apiUrl" value="https://raguia.valentin-fiess.fr" placeholder="https://votre-domaine.fr" required />
      </div>

      <div class="form-group">
        <label for="slug">Identifiant (slug client)</label>
        <input type="text" id="slug" placeholder="mon-client" required />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>

      <div class="form-group">
        <label for="watchDir">Dossier à surveiller</label>
        <div class="input-with-button">
          <input type="text" id="watchDir" placeholder="Documents/RAGUIA" readonly />
          <button type="button" id="browseBtn">Parcourir…</button>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="connectBtn">
        <span class="spinner"></span>
        <span class="btn-text">Se connecter</span>
      </button>
    </form>

    <div id="message" class="message"></div>
    <div class="footer">v0.1.0</div>
  </div>

  <script>
    (async () => {
      const __TAURI__ = window.__TAURI__;
      const invoke = __TAURI__.core.invoke;
      const dialog = __TAURI__.dialog;

      const form = document.getElementById('wizardForm');
      const connectBtn = document.getElementById('connectBtn');
      const messageEl = document.getElementById('message');
      const browseBtn = document.getElementById('browseBtn');
      const watchDir = document.getElementById('watchDir');

      // Default watch dir: ~/Documents/RAGUIA
      try {
        const home = await invoke('get_home_dir');
        watchDir.value = home + '/Documents/RAGUIA';
      } catch {
        watchDir.value = '~/Documents/RAGUIA';
      }

      browseBtn.addEventListener('click', async () => {
        try {
          const selected = await dialog.open({
            directory: true,
            multiple: false,
            title: 'Choisir le dossier de synchronisation'
          });
          if (selected) {
            watchDir.value = selected;
          }
        } catch (e) {
          console.error('Folder picker failed:', e);
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        setMessage('', '');

        const apiUrl = document.getElementById('apiUrl').value.trim();
        const slug = document.getElementById('slug').value.trim();
        const password = document.getElementById('password').value.trim();
        const watchDirVal = watchDir.value.trim();

        if (!apiUrl || !slug || !password) {
          setMessage('Veuillez remplir tous les champs obligatoires.', 'error');
          return;
        }

        setLoading(true);

        try {
          const result = await invoke('login', {
            slug: slug,
            password: password,
            apiUrl: apiUrl,
            watchDir: watchDirVal || null,
          });

          setMessage('Connexion réussie ! Démarrage de l\'agent…', 'success');

          // Close wizard window after a short delay
          setTimeout(async () => {
            try {
              await __TAURI__.window.getCurrent().close();
            } catch {
              window.close();
            }
          }, 1200);
        } catch (err) {
          setMessage(typeof err === 'string' ? err : err.message || 'Erreur de connexion', 'error');
        } finally {
          setLoading(false);
        }
      });

      function setLoading(loading) {
        connectBtn.classList.toggle('loading', loading);
        connectBtn.disabled = loading;
      }

      function setMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = 'message' + (type ? ' ' + type : '');
      }
    })();
  </script>
</body>
</html>
